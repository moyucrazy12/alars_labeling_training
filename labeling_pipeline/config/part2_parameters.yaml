paths:
  image_dir: "dataset_to_label/images"
  label_dir: "dataset_to_label/labels"
  vis_dir: "dataset_to_label/visualizations_final"

models:
  sam2_root: "models/sam2"
  sam2_checkpoint: "models/sam2/checkpoints/sam2.1_hiera_large.pt"
  sam2_model_cfg: "configs/sam2.1/sam2.1_hiera_l.yaml"

runtime:
  device: "cuda"
  min_mask_area: 20
  save_viz: false

output:
  # true: save/load as YOLO OBB rows:
  #   class_id x1 y1 x2 y2 x3 y3 x4 y4
  # false: save/load as normal YOLO detection rows:
  #   class_id x_center y_center width height
  use_obb: true

classes:
  id_to_name:
    "0": "sam"
    "1": "buoy"
    "2": "hook"
    "3": "land_pad"
    "4": "lolo"
    "5": "catamaran"
    "6": "boat"
    "7": "person"

ui:
  window_name: "annotator"
  result_window: "preview"