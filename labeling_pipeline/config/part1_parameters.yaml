paths:
  input_dir: "dataset_to_label/images"
  output_label_dir: "dataset_to_label/labels"
  output_viz_dir: "dataset_to_label/visualizations_part1"

models:
  sam3_root: "models/sam3"
  yolo26_model: "models/yolo_models/yoloe-26x-seg.pt"
  yolo11_model: "models/yolo_models/yolo_model_4cls_july.pt"

runtime:
  device: 0
  img_size: 1024
  iou_thres: 0.45
  save_viz: true

output:
  # overwrite: replace existing .txt files
  # append: always add generated detections
  # append_unique: preserve existing labels and avoid exact duplicate rows
  label_write_mode: "append_unique"

merge:
  min_mask_area: 20
  iou_match_thresh: 0.15

classes:
  id_to_name:
    "0": "sam"
    "1": "buoy"
    "2": "hook"
    "3": "land_pad"
    "4": "lolo"
    "5": "catamaran"
    "6": "boat"
    "7": "person"

# Model-specific settings.
yolo26:
  enabled: true
  confidence: 0.45
  labels:
    - boat

yolo11:
  enabled: false
  confidence: 0.45
  labels:
    - land_pad

sam3:
  enabled: true
  confidence: 0.45
  prompts:
    - boat